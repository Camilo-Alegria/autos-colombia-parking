<div class="flex min-h-dvh items-center justify-center bg-[#0F172A] px-4 text-slate-100">
  <div class="card w-full max-w-md">
    <div class="text-center">
      <p class="text-xs font-semibold uppercase tracking-[0.2em] text-sky-400">Autos Colombia</p>
      <h1 class="mt-1 text-2xl font-bold text-white">Iniciar Sesión</h1>
      <p class="mt-1 text-sm text-slate-400">Sistema de Control de Parqueadero Mensual</p>
    </div>

    @if (error(); as err) {
      <div class="mt-4 rounded-xl border border-red-700 bg-red-950/60 px-4 py-3 text-sm text-red-100">
        {{ err }}
      </div>
    }

    <form class="mt-6 space-y-4" (ngSubmit)="ingresar()">
      <div>
        <label class="mb-1 block text-sm text-slate-300">Usuario</label>
        <input class="field" name="usuario" [(ngModel)]="usuario" placeholder="Ej. admin u operador" required autocomplete="username" />
      </div>
      <div>
        <label class="mb-1 block text-sm text-slate-300">Contraseña</label>
        <input class="field" name="password" type="password" [(ngModel)]="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button class="btn-primary w-full mt-2" type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Autenticando…' : 'Ingresar al Sistema' }}
      </button>
    </form>

    <div class="mt-6 rounded-xl border border-slate-800 bg-slate-950/50 p-3 text-xs text-slate-400 text-center">
      <p>BIENVENIDO</p>
      
    </div>
  </div>
</div>
